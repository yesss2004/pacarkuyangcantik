<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kisah Kita ❤️</title>
  <link rel="stylesheet" href="style.css">
  <!-- Font Google -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Sacramento&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Container Utama -->
  <div class="card">
    <div class="header">
      <h1 class="title">Untuk Seseorang yang Spesial ❤️</h1>
      <p class="subtitle">Setiap detik bersamamu adalah momen berharga</p>
    </div>

    <!-- Galeri Foto -->
    <div class="section">
      <h2>pap pacarku tercinta 📸</h2>
      <div class="gallery">
        <div class="photo-card">
          <img src="foto1.jpeg" alt="Foto 1">
          <p>wlleee✨</p>
        </div>
        <div class="photo-card">
          <img src="foto2.jpeg" alt="Foto 2">
          <p>cantik💕</p>
        </div>
        <div class="photo-card">
          <img src="foto3.jpeg" alt="Foto 3">
          <p>cantik sekali💕</p>
        </div>
      </div>
    </div>

    <!-- Momen Video -->
    <div class="section">
      <h2>Video pacarku yang cantik banget 🎬</h2>
      <div class="video-wrapper">
        <video controls poster="foto1.jpeg">
          <source src="sayang.mp4" type="video/mp4">
          Browser Anda tidak mendukung pemutaran video.
        </video>
      </div>
    </div>

    <!-- Bagian Pesan Interaktif -->
    <div class="section question-box">
      <h2 id="question-text">Maukah kamu terus berjalan bersamaku? 🌹</h2>
      <div class="buttons">
        <button id="btn-yes" class="btn btn-yes">Mau Banget! ❤️</button>
        <button id="btn-no" class="btn btn-no">Enggak 😜</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
