<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Untuk Kamu ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <header>
      <span class="badge">Dua Kota, Satu Hati ✈️</span>
      <h1>Untuk Pacar Tersayang ❤️</h1>
      <p class="subtitle">Meski belum sempat bertatap muka, jarak tidak mengurangi rasaku sedikit pun.</p>
      <button class="hug-btn" onclick="sendHug()"> Peluk Jarak Jauh 🤗</button>
    </header>

    <!-- Filter Navigasi (Rata Tengah) -->
    <div class="tabs">
      <button class="tab-btn" onclick="filterCategory('pesan', this)">Pesan</button>
      <button class="tab-btn" onclick="filterCategory('foto', this)">Foto</button>
      <button class="tab-btn" onclick="filterCategory('video', this)">Video</button>
    </div>

    <!-- Konten Utama -->
    <div class="feed">

      <!-- KARTU PESAN -->
      <div class="card item-pesan" onclick="openModal('Surat Untukmu 💌', 'Walaupun kita belum pernah bertemu langsung, setiap harinya kamu selalu berhasil bikin aku tersenyum. Terima kasih ya sudah bertahan sampai hari ini. Nanti kalau waktunya tiba, pelukan pertama bakal jadi momen paling spesial!')">
        <div class="card-header">
          <span class="card-tag">💌 Pesan</span>
        </div>
        <div class="card-title">Untuk Kamu yang Di Sana</div>
        <div class="card-desc">Klik untuk membaca pesan manis rahasia...</div>
      </div>

      <!-- 6 KARTU FOTO (OTOMATIS TAMPIL BESAR SAAT DIKLIK) -->
      <div class="card item-foto photo-only" onclick="openImageModal(this)">
        <div class="media-box"><img src="foto1.jpeg" alt="Foto 1"></div>
      </div>
 
      <div class="card item-foto photo-only" onclick="openImageModal(this)">
        <div class="media-box"><img src="foto2.jpeg" alt="Foto 2"></div>
      </div>

      <div class="card item-foto photo-only" onclick="openImageModal(this)">
        <div class="media-box"><img src="foto3.jpeg" alt="Foto 3"></div>
      </div>

      <div class="card item-foto photo-only" onclick="openImageModal(this)">
        <div class="media-box"><img src="foto4.jpeg" alt="Foto 4"></div>
      </div>

      <div class="card item-foto photo-only" onclick="openImageModal(this)">
        <div class="media-box"><img src="foto5.jpeg" alt="Foto 5"></div>
      </div>

      <div class="card item-foto photo-only" onclick="openImageModal(this)">
        <div class="media-box"><img src="foto6.jpeg" alt="Foto 6"></div>
      </div>

      <!-- KARTU VIDEO -->
      <div class="card item-video">
        <div class="card-header">
          <span class="card-tag">🎥 Video</span>
        </div>
        <div class="card-title">Pacarku yang ngambekan 💕</div>
        <div class="media-box">
          <video loop playsinline controls preload="metadata">
            <source src="sayang.mp4" type="video/mp4">
            Browser kamu tidak mendukung video.
          </video>
        </div>
      </div>

    </div>
  </div>

  <!-- Pop-up Modal Pesan Teks -->
  <div id="modal" class="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <h2 id="modal-title" style="margin-bottom: 15px; color: var(--primary);"></h2>
      <p id="modal-text" style="color: var(--text-main); line-height: 1.6;"></p>
    </div>
  </div>

  <!-- Pop-up Modal Foto Ukuran Besar (Tanpa Tulisan) -->
  <div id="image-modal" class="modal" onclick="closeImageModal()">
    <div class="modal-image-content" onclick="event.stopPropagation()">
      <span class="close-btn image-close" onclick="closeImageModal()">&times;</span>
      <img id="modal-img-src" src="" alt="Foto Besar">
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
